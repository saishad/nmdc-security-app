<!DOCTYPE html>
<html lang="en" dir="ltr" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMDC Construction Site - Security Operations Center (SOC)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        [dir="rtl"] body {
            font-family: 'Cairo', sans-serif;
        }
        
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-100 leading-tight" data-i18n="app_title">NMDC Security Operations Center</h1>
                <p class="text-xs text-slate-400" data-i18n="app_subtitle">20 KM Site • Plots A–G • 20 Gates • 18 Patrol Fleet</p>
            </div>
        </div>

        <!-- Controls / Badges -->
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <!-- Sync Indicator -->
            <div id="db-status-badge" class="hidden sm:flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse mr-1.5 rtl:ml-1.5 rtl:mr-0"></span>
                <span id="db-status-text">Local Storage Mode</span>
            </div>

            <!-- Role Selector -->
            <select id="user-role-select" onchange="changeRole(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-amber-500 outline-none">
                <option value="Director">Director of Security</option>
                <option value="ShiftManager">Shift Security Manager</option>
                <option value="AreaSupervisor">Area Supervisor</option>
                <option value="PlotSupervisor">Plot Supervisor</option>
                <option value="GateGuard">Gate Access Guard</option>
            </select>

            <!-- Language Switcher -->
            <button onclick="toggleLanguage()" class="flex items-center space-x-1.5 rtl:space-x-reverse bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium text-amber-400 transition-colors">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                <span id="lang-btn-text">العربية</span>
            </button>

            <!-- Database Settings Modal Button -->
            <button onclick="openSettingsModal()" class="p-1.5 text-slate-400 hover:text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-colors" title="Database Configuration">
                <i data-

<!DOCTYPE html>
<html lang="en" dir="ltr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Murabba Delivery Security Operations Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        [dir="rtl"] body { font-family: 'Cairo', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

    <!-- Top Executive Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-5 py-3 flex items-center justify-between shrink-0 backdrop-blur-md">
        <div class="flex items-center space-x-4 rtl:space-x-reverse">
            <div class="bg-amber-500 text-slate-950 p-2 rounded-xl font-black flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2 rtl:space-x-reverse">
                    <h1 class="text-base font-bold text-slate-100 leading-tight" data-i18n="app_title">New Murabba Delivery Security Operations</h1>
                    <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded text-[10px] font-mono font-bold">RIYADH HQ</span>
                </div>
                <p class="text-xs text-slate-400" data-i18n="app_subtitle">Construction Security Governance • CCC Dispatch • 24/7 Site Assurance</p>
            </div>
        </div>

        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <div id="sync-indicator" class="flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-2 rtl:ml-2 rtl:mr-0"></span>
                <span id="sync-text">Live Sync Active</span>
            </div>

            <select id="role-selector" onchange="changeRole(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-1.5 outline-none">
                <option value="Director">Director of Delivery Security</option>
                <option value="CCC">NM CCC Supervisor / Operator</option>
                <option value="Provider">Security Provider Manager</option>
                <option value="SubDev">Sub-Developer Representative</option>
                <option value="FieldGuard">Field Officer / Patrol Driver</option>
            </select>

            <button onclick="toggleLanguage()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold text-amber-400 transition-colors flex items-center space-x-1.5 rtl:space-x-reverse">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                <span id="lang-btn-text">العربية</span>
            </button>
        </div>
    </header>

    <!-- Workspace Body -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900/60 border-r border-slate-800 flex flex-col justify-between shrink-0 rtl:border-r-0 rtl:border-l">
            <nav class="p-3 space-y-1">
                <button onclick="switchTab('director')" id="nav-director" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span data-i18n="nav_director">Director Overview</span>
                </button>
                <button onclick="switchTab('ccc')" id="nav-ccc" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="radio" class="w-4 h-4"></i>
                    <span data-i18n="nav_ccc">CCC Operations & Dispatch</span>
                </button>
                <button onclick="switchTab('fleet')" id="nav-fleet" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="truck" class="w-4 h-4"></i>
                    <span data-i18n="nav_fleet">Vehicles & Equipment (13)</span>
                </button>
                <button onclick="switchTab('roster')" id="nav-roster" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span data-i18n="nav_roster">Deployment & Shifts</span>
                </button>
                <button onclick="switchTab('incidents')" id="nav-incidents" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                    <span data-i18n="nav_incidents">Incidents & Investigations</span>
                </button>
                <button onclick="switchTab('copilot')" id="nav-copilot" class="w-full flex items-center space-x-3 rtl:space-x-reverse px-3.5 py-2.5 rounded-xl text-xs font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20">
                    <i data-lucide="bot" class="w-4 h-4"></i>
                    <span data-i18n="nav_copilot">Security Operations Copilot</span>
                </button>
            </nav>

            <div class="p-3 m-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-xs">
                <div class="flex items-center justify-between text-slate-400">
                    <span data-i18n="lbl_active_shift">Active Shift</span>
                    <span class="text-emerald-400 font-semibold">Shift 1 (Morning)</span>
                </div>
                <div class="text-slate-500 font-mono text-[11px]">06:00 – 14:00 AST</div>
            </div>
        </aside>

        <!-- Main Workspace Render Panels -->
        <main class="flex-1 overflow-y-auto p-5 bg-slate-950 relative">
            <section id="tab-director" class="space-y-5"></section>
            <section id="tab-ccc" class="hidden space-y-4"></section>
            <section id="tab-fleet" class="hidden space-y-4"></section>
            <section id="tab-roster" class="hidden space-y-4"></section>
            <section id="tab-incidents" class="hidden space-y-4"></section>
            <section id="tab-copilot" class="hidden space-y-4"></section>
        </main>
    </div>

    <!-- Application Controller Script -->
    <script>
        const AppState = {
            currentRole: 'Director',
            fleet: [
                { id: "NM-X01", role: "Sector Patrol North A", status: "Active", driver: "Ahmad Suleiman", fuel: 85, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X02", role: "Sector Patrol North B", status: "Active", driver: "Sultan Otaibi", fuel: 90, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X03", role: "Sector Patrol South C", status: "Active", driver: "Youssef Ibrahim", fuel: 75, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X04", role: "Sector Patrol South D", status: "Active", driver: "Bader Mutairi", fuel: 80, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X05", role: "Sector Patrol West E", status: "Active", driver: "Hamad Qahtani", fuel: 95, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X06", role: "Sector Patrol West F", status: "Active", driver: "Saleh Zahrani", fuel: 70, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X07", role: "Sector Patrol West G", status: "Active", driver: "Waleed Ruwaili", fuel: 85, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X08", role: "Gate Support Patrol", status: "Active", driver: "Fahad Harbi", fuel: 90, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X09", role: "CCC Rapid Response", status: "Active", driver: "Saad Al-Khalaf", fuel: 100, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X10", role: "Supervisor Mobile Unit", status: "Active", driver: "Tariq Mansoor", fuel: 80, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X11", role: "Quarantined / Repair", status: "Defective", driver: "Unassigned", fuel: 40, dashcam: "FAULT", bravo: "Offline" },
                { id: "NM-X12", role: "Reserve Unit 2", status: "Reserve", driver: "Unassigned", fuel: 100, dashcam: "OK", bravo: "Tested" },
                { id: "NM-X13", role: "Reserve Unit 3 (Deployed)", status: "Active", driver: "Rayan Malki", fuel: 100, dashcam: "OK", bravo: "Tested" }
            ]
        };

        function renderAllModules() {
            // Render Director View
            document.getElementById('tab-director').innerHTML = `
                <div class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-4 space-y-3 relative overflow-hidden">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 rtl:space-x-reverse">
                            <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i>
                            <h2 class="text-sm font-bold text-indigo-200">AI Operational Briefing for Director of Security</h2>
                        </div>
                        <span class="text-[10px] text-slate-500 font-mono">Live AST Timestamp</span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed">
                        Critical post coverage is currently at <strong>96.4%</strong>. Gate C3 in Plot C experienced an unannounced officer absence at 07:15 AST; relief deployment is in progress. Vehicle <strong>NM-X11</strong> failed pre-shift dashcam inspection and has been quarantined.
                    </p>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <div class="text-xs text-slate-400">Post Coverage</div>
                        <div class="text-2xl font-black text-slate-100">27 / 28 <span class="text-xs font-normal text-rose-400">(1 Gap)</span></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <div class="text-xs text-slate-400">Fleet Readiness</div>
                        <div class="text-2xl font-black text-slate-100">10 / 10 <span class="text-xs font-normal text-emerald-400">(3 Reserve)</span></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <div class="text-xs text-slate-400">Active Incidents</div>
                        <div class="text-2xl font-black text-rose-400">2 <span class="text-xs font-normal text-slate-400">Investigating</span></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <div class="text-xs text-slate-400">Provider SLA</div>
                        <div class="text-2xl font-black text-blue-400">94.2%</div>
                    </div>
                </div>
            `;

            // Render Fleet View
            document.getElementById('tab-fleet').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-sm font-bold text-slate-100">Patrol Fleet & Equipment Manager (13 Nissan X-Trails)</h2>
                        <p class="text-xs text-slate-400">10 Operational Patrol Allocations + 3 Reserve Units</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    ${AppState.fleet.map(v => `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-sm text-amber-400 font-mono">${v.id}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${v.status === 'Active' ? 'bg-emerald-500/20 text-emerald-400' : (v.status === 'Defective' ? 'bg-rose-500/20 text-rose-400' : 'bg-slate-800 text-slate-400')}">${v.status}</span>
                            </div>
                            <div class="text-xs font-semibold text-slate-200">${v.role}</div>
                            <div class="text-[11px] text-slate-400">Driver: <span class="text-slate-200">${v.driver}</span></div>
                            <div class="pt-2 border-t border-slate-800 flex justify-between text-[10px] font-mono text-slate-500">
                                <span>Fuel: ${v.fuel}%</span>
                                <span>Dashcam: <strong class="${v.dashcam === 'OK' ? 'text-emerald-400' : 'text-rose-400'}">${v.dashcam}</strong></span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Render CCC View
            document.getElementById('tab-ccc').innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <h2 class="text-sm font-bold text-slate-100 mb-2">Command & Control Center (CCC) Live Dispatch Hub</h2>
                    <p class="text-xs text-slate-400">Single recognized dispatch authority for New Murabba Project Site</p>
                </div>
            `;

            // Re-initialize icons
            if (window.lucide) { lucide.createIcons(); }
        }

        function switchTab(tabId) {
            ['director', 'ccc', 'fleet', 'roster', 'incidents', 'copilot'].forEach(id => {
                const sec = document.getElementById(`tab-${id}`);
                const nav = document.getElementById(`nav-${id}`);
                if (sec) sec.classList.add('hidden');
                if (nav) {
                    nav.classList.remove('bg-amber-500/10', 'text-amber-400', 'border', 'border-amber-500/20');
                    nav.classList.add('text-slate-400');
                }
            });

            const activeSec = document.getElementById(`tab-${tabId}`);
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeSec) activeSec.classList.remove('hidden');
            if (activeNav) {
                activeNav.classList.add('bg-amber-500/10', 'text-amber-400', 'border', 'border-amber-500/20');
                activeNav.classList.remove('text-slate-400');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAllModules();
        });
    </script>
</body>
</html>
